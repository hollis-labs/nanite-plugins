name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5
      - id: plugins
        run: echo "plugins=$(make -s plugins-json)" >> "$GITHUB_OUTPUT"
  plugin:
    needs: registry
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.registry.outputs.plugins) }}
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: ${{ matrix.plugin }}
          args: --config ../.golangci.yml --timeout=5m ./...
      - run: go test -race ./...
      - run: make dist
      - name: Public contract imports
        working-directory: .
        run: python3 scripts/check-dependencies.py
